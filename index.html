<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ajio Home Page</title>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <div class="home">
      <header class="header" align="right">
        <h2><a href="#">Sign in/Join AJIO</a></h2>
        <h2><a href="#">Customer Care</a></h2>
      </header>
      <div class="ho">
        <div class="whole">
          <h1>AJIO</h1>
        </div>
        <div class="main">
          <a href="#">Men</a>
          <a href="#">Women</a>
          <a href="#">Kids</a>
          <a href="#">Indie</a>
          <a href="#">Home & Living</a>
          <a href="#">Beauty</a>
          <a href="#">Studio</a>
          <div class="search-container">
            <input
              class="search"
              type="text"
              placeholder="Search..."
              name="search"
            />
          </div>
          <div class="wishlist">
            <img src="https://assets.ajio.com/static/img/wishlistIcon.svg" alt="Wishlist Icon">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkGJyunhrsZ7QcQuLOT3aKNuc3VVLbnMCMkA&usqp=CAU" width="35px" height="35px" alt="User Icon">
          </div>
        </div>
      </div>
      <div class="click">
        <div class="button-container">
          <button type="button" class="click-button">Click me</button>
        </div>
        <p>
          <a href="https://www.ajio.com/">Visit AJIO</a>
        </p>
      </div>
    </div>
  </body>
</html>
